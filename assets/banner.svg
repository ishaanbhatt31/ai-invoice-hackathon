<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" style="background:#0b0f19; border-radius:12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative grid / circles -->
  <circle cx="150" cy="180" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="140" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Badges row -->
  <g transform="translate(60, 48)">
    <rect width="145" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981" />
    <text x="26" y="19" fill="#93c5fd" font-size="12" font-weight="600">SEPOLIA TESTNET</text>

    <rect x="155" width="130" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <text x="170" y="19" fill="#c4b5fd" font-size="12" font-weight="600">⚡ GROQ LLM API</text>

    <rect x="295" width="140" height="28" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
    <text x="310" y="19" fill="#f472b6" font-size="12" font-weight="600">🔒 SHA-256 PROOF</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="140" fill="#f8fafc" font-size="44" font-weight="800" letter-spacing="-0.5">
    AI Invoice Generator
  </text>
  <text x="60" y="188" fill="url(#primaryGrad)" font-size="34" font-weight="700">
    with On-Chain Cryptographic Proof
  </text>

  <!-- Subtitle -->
  <text x="60" y="235" fill="#94a3b8" font-size="17" font-weight="400">
    Draft client invoices from plain English prompts with Groq AI, hash them with SHA-256,
  </text>
  <text x="60" y="260" fill="#94a3b8" font-size="17" font-weight="400">
    and immutably anchor verification stamps to Ethereum Sepolia for tamper-proof auditing.
  </text>

  <!-- Ethereum Diamond Logo Accent -->
  <g transform="translate(1020, 100) scale(1.1)">
    <polygon points="40,0 0,60 40,84 80,60" fill="#6366f1" opacity="0.85" />
    <polygon points="40,0 40,84 80,60" fill="#818cf8" opacity="0.95" />
    <polygon points="40,92 0,68 40,124" fill="#4f46e5" opacity="0.85" />
    <polygon points="40,92 40,124 80,68" fill="#6366f1" opacity="0.95" />
  </g>

  <!-- Metric Badges at bottom -->
  <g transform="translate(60, 305)">
    <text x="0" y="14" fill="#38bdf8" font-size="13" font-weight="700">Contract Address:</text>
    <text x="135" y="14" fill="#cbd5e1" font-size="13" font-family="'Courier New', monospace">0x95F22200f17be6B6E5Cb7309ddB22a907C6ccd40</text>
  </g>
</svg>
